<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cuestionarios ORL">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#00704a">
<title>Cuestionarios ORL</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --inr-green:#00704a; --inr-green-dark:#00563a; --inr-green-soft:#e7f2ec; --inr-red:#d4112b; --inr-gold:#d9c27f;
  --pt-bg:#f7f6f3; --pt-ink:#1d1d1b; --pt-slate:#5c6672; --pt-line:#e3e1db;
  --bg:#f3f6f8; --card:#ffffff; --ink:#18232e; --muted:#5a6a7a; --line:#d9e1e8; --grid:#e7ecf0;
  --brand:#0f6e8c; --brand-dark:#0b566d; --brand-soft:#e3f2f7;
  --ok:#1d7f46; --ok-bg:#e4f4ea; --warn:#9a6300; --warn-bg:#fdf1db; --bad:#b3261e; --bad-bg:#fbe5e3;
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;font-size:18px}
.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:920px;margin:0 auto;
  padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))}
.center{flex:1;display:flex;flex-direction:column;justify-content:center}
h1{font-size:34px;line-height:1.2;margin:0 0 12px}
h2{font-size:26px;margin:0 0 10px}
h3{font-size:19px;margin:0 0 8px}
p{margin:0 0 12px}
.lead{font-size:21px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.stack>*+*{margin-top:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:0;border-radius:14px;background:var(--brand);color:#fff;font-size:20px;font-weight:600;padding:16px 30px;min-height:58px}
.btn:active{background:var(--brand-dark)}
.btn[disabled]{opacity:.35}
.btn.ghost{background:transparent;color:var(--brand);border:2px solid var(--brand)}
.btn.plain{background:transparent;color:var(--muted);padding:12px 16px}
.btn.danger{background:var(--bad)}
.btn.sm{font-size:16px;padding:10px 16px;min-height:44px;border-radius:10px}
.btn.big{font-size:24px;padding:20px 44px;min-height:70px}
.link{background:none;border:0;color:var(--brand);font-size:19px;text-decoration:underline;padding:12px 0}
.field{display:block;margin-bottom:18px}
.field span{display:block;font-weight:600;margin-bottom:6px;font-size:18px}
.field input{width:100%;font-size:22px;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.field input:focus{outline:none;border-color:var(--brand)}
.field.huge input{font-size:32px;padding:18px;letter-spacing:.04em;text-align:center}
.choices{display:grid;gap:14px}
.choice{display:flex;align-items:center;gap:18px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:18px;padding:22px;min-height:96px}
.choice:active,.choice.sel{border-color:var(--brand);background:var(--brand-soft)}
.choice .ic{flex:none;width:56px;height:56px;border-radius:14px;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand)}
.choice b{display:block;font-size:23px}
.choice small{display:block;font-size:17px;color:var(--muted);margin-top:2px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;font-size:17px;color:var(--muted)}
.progress{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:26px}
.progress i{display:block;height:100%;background:var(--brand);border-radius:6px;transition:width .25s}
.qtext{font-size:20px;color:var(--muted);margin-bottom:6px}
.qitem{font-size:32px;font-weight:700;line-height:1.2;margin-bottom:24px}
.opt{display:flex;align-items:center;gap:16px;width:100%;text-align:left;font-size:22px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:12px;min-height:70px}
.opt .n{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--bg);border:1px solid var(--line);font-size:20px}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .n{background:var(--brand);color:#fff;border-color:var(--brand)}
.qfoot{display:flex;justify-content:space-between;gap:12px;margin-top:auto;padding-top:18px}
.staff-link{background:transparent;border:0;color:#9aa3ad;font-size:14px;padding:10px 4px;font-family:inherit}
/* ===== Tema paciente: INR + Dr. Hernaiz ===== */
.pt{font-family:"Montserrat",-apple-system,"SF Pro Text",Helvetica,Arial,sans-serif;background:var(--pt-bg);color:var(--pt-ink);max-width:980px;padding-top:0}
body:has(.pt){background:var(--pt-bg)}
.pt h1,.pt h2{font-weight:600;letter-spacing:-.01em;color:var(--pt-ink)}
.pt .display{font-size:52px;font-weight:300;letter-spacing:-.02em;margin:6px 0 14px}
.pt .lead{color:var(--pt-slate);font-size:21px;line-height:1.5}
.pt .muted{color:var(--pt-slate)}
.pt .card{border:1px solid var(--pt-line);border-radius:22px;box-shadow:0 1px 2px rgba(29,29,27,.04),0 8px 30px rgba(29,29,27,.06);padding:30px}
.pt .btn{background:var(--inr-green);font-family:inherit;font-weight:600;letter-spacing:.01em;border-radius:14px}
.pt .btn:active{background:var(--inr-green-dark)}
.pt .btn.ghost{background:#fff;color:var(--inr-green);border:2px solid var(--inr-green)}
.pt .btn.plain{background:transparent;color:var(--pt-slate)}
.pt .link{color:var(--inr-green);font-family:inherit}
.pt .field input,.pt .mrn input{font-family:inherit;border-color:var(--pt-line);border-radius:14px}
.pt .field input:focus,.pt .mrn input:focus{border-color:var(--inr-green);box-shadow:0 0 0 4px var(--inr-green-soft)}
.pt .banner{background:#fbf3e4;color:#6b4a00}
.pt .choice{border:2px solid var(--pt-line);border-radius:20px;box-shadow:0 1px 2px rgba(29,29,27,.04)}
.pt .choice .ic{background:var(--inr-green-soft);color:var(--inr-green)}
.pt .choice:active,.pt .choice.sel{border-color:var(--inr-green);background:var(--inr-green-soft)}
.pt .choice b{font-weight:600}
.pt .opt{border:2px solid var(--pt-line);border-radius:18px;font-family:inherit;box-shadow:0 1px 2px rgba(29,29,27,.04)}
.pt .opt .n{background:#f4f3ef;border-color:var(--pt-line);color:var(--pt-ink);font-weight:600}
.pt .opt.sel{border-color:var(--inr-green);background:var(--inr-green-soft)}
.pt .opt.sel .n{background:var(--inr-green);border-color:var(--inr-green);color:#fff}
.pt .qitem{font-weight:600;color:var(--pt-ink)}
.pt .qtext,.pt .qhead{color:var(--pt-slate)}
.pt .progress{background:#e6e4de;height:8px}
.pt .progress i{background:var(--inr-green)}
.brand{position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 4px 18px;margin-bottom:8px;border-bottom:1px solid var(--pt-line)}
.brand::before{content:"";position:absolute;left:-16px;right:-16px;top:0;height:5px;background:linear-gradient(90deg,var(--inr-green) 0 78%,var(--inr-gold) 78% 90%,var(--inr-red) 90% 100%)}
.brand img{display:block;height:66px;width:auto;object-fit:contain}
.brand .lg-inr{height:62px}
.brand-div{flex:1;align-self:stretch;max-width:1px;background:var(--pt-line);margin:4px auto}
.brand.big{padding:34px 4px 26px}
.brand.big img{height:104px}.brand.big .lg-inr{height:92px}
.welcome .hero{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 8px 10vh}
.eyebrow{font-size:15px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--inr-green)}
.steps{list-style:none;padding:0;margin:18px 0 34px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.steps li{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--pt-line);border-radius:18px;padding:18px}
.steps .sn{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--inr-green)}
.steps b{display:block;font-size:18px;font-weight:600}
.steps small{display:block;font-size:15px;color:var(--pt-slate);margin-top:2px}
.btn.cta{align-self:flex-start;font-size:24px;padding:22px 52px;border-radius:16px;box-shadow:0 8px 24px rgba(0,112,74,.25)}
.pt-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--pt-line);padding-top:14px;color:var(--pt-slate);font-size:15px}
.pt-foot span{display:inline-flex;gap:8px;align-items:center}
.done-card{max-width:640px;margin:0 auto}
.done-ic{color:var(--inr-green)}
.done-ic svg{width:84px;height:84px}
@media (max-width:700px){.steps{grid-template-columns:1fr}.pt .display{font-size:40px}.brand img{height:34px}.brand .lg-inr{height:38px}.brand.big img{height:56px}.brand.big .lg-inr{height:60px}.btn.cta{align-self:stretch}}
#overlay{position:fixed;inset:0;background:rgba(20,30,40,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#overlay.show{display:flex}
#overlay .card{max-width:520px;width:100%;text-align:center}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:16px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
/* clinician */
.clin{max-width:1100px;font-size:16px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.topbar h1{font-size:24px;margin:0}
.tabs{display:flex;gap:6px;background:#e6ecf1;padding:4px;border-radius:12px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:9px 14px;border-radius:9px;font-size:15px;font-weight:600;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.list{display:flex;flex-direction:column;gap:10px}
.rec{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;width:100%}
.rec .who{flex:1;min-width:200px}
.rec .who b{font-size:17px}
.rec .who div{font-size:14px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.done{background:#eef1f4;color:var(--muted)}
.visits{display:flex;gap:6px;flex-wrap:wrap}
.visits button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;color:var(--muted)}
.visits button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.score{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;border-left:6px solid var(--line)}
.score.ok{border-left-color:var(--ok)} .score.warn{border-left-color:var(--warn)} .score.bad{border-left-color:var(--bad)}
.score .lbl{font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.score .val{font-size:36px;font-weight:800;line-height:1.1;margin:4px 0}
.score .val small{font-size:18px;font-weight:600;color:var(--muted)}
.score .cat{font-weight:600}
.score.ok .cat{color:var(--ok)} .score.warn .cat{color:var(--warn)} .score.bad .cat{color:var(--bad)}
.score .sub{font-size:14px;color:var(--muted);margin-top:4px}
textarea.note{width:100%;min-height:200px;font-size:15px;font-family:ui-monospace,Menlo,Consolas,monospace;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fbfcfd;color:var(--ink);resize:vertical}
details.sec{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
details.sec>summary{padding:14px 16px;font-weight:700;font-size:17px;cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec .body{padding:0 16px 16px}
table.items{width:100%;border-collapse:collapse;font-size:15px}
table.items td,table.items th{padding:8px 6px;border-bottom:1px solid #edf1f4;text-align:left;vertical-align:top}
table.items th{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase}
table.items td.s{width:70px;text-align:center;font-weight:700}
table.items tr.hi td{background:#fff6f5}
table.items td.num,table.items th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.dom{display:grid;grid-template-columns:minmax(150px,200px) 1fr 70px;gap:8px 12px;align-items:center;font-size:15px}
.dom .track{height:12px;background:var(--brand-soft);border-radius:6px;overflow:hidden}
.dom .track i{display:block;height:100%;background:var(--brand);border-radius:0 6px 6px 0}
.dom .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-bottom:12px}
.chart{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 14px 8px}
.chart h4{margin:0;font-size:15px}
.chart .cap{font-size:13px;color:var(--muted);margin-bottom:6px}
.chart svg{display:block;width:100%;height:auto}
.chart .pt{cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:9px 14px;font-size:15px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--brand);color:#fff}
.guide{font-size:15px}
.guide table{width:100%;border-collapse:collapse;margin:6px 0 14px}
.guide td,.guide th{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.guide th{background:#f0f4f7}
.guide .ok{color:var(--ok);font-weight:600}.guide .warn{color:var(--warn);font-weight:600}.guide .bad{color:var(--bad);font-weight:600}
.banner{background:var(--warn-bg);color:#6b4500;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:15px}
.empty{padding:30px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:14px}
.pinpad{display:grid;grid-template-columns:repeat(3,80px);gap:12px;justify-content:center;margin:18px 0}
.pinpad button{height:70px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:28px;font-weight:600}
.pindots{display:flex;gap:14px;justify-content:center;margin:10px 0}
.pindots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--brand)}
.pindots i.f{background:var(--brand)}
.mini input,.mini select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--ink)}
.mrn{display:flex;align-items:center;justify-content:center;gap:8px;font-size:34px;font-weight:700;color:var(--ink);flex-wrap:nowrap}
.mrn input{font:inherit;font-size:34px;font-weight:700;padding:14px 10px;border:2px solid var(--line);border-radius:12px;text-align:center;letter-spacing:.06em;font-variant-numeric:tabular-nums;background:#fff;color:var(--ink);min-width:0}
.mrn input:focus{outline:none;border-color:var(--brand)}
.mrn input.num{width:9.2ch}.mrn input.yr{width:5.6ch}
.mrn.sm{font-size:17px;justify-content:flex-start;gap:4px}.mrn.sm input{font-size:17px;padding:8px 6px;border-width:1px;border-radius:10px}
.mrnhint{text-align:center;color:var(--muted);font-size:17px;margin:8px 0 18px}
.ev{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #edf1f4;flex-wrap:wrap}
.evtag{display:inline-block;min-width:38px;text-align:center;font-size:12px;font-weight:700;color:#fff;background:#3b4856;border-radius:6px;padding:3px 6px}
.lkey{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:5px}
@media (max-width:600px){h1{font-size:28px}.qitem{font-size:26px}.opt{font-size:19px}.btn.big{font-size:21px;padding:18px 30px}.dom{grid-template-columns:120px 1fr 56px}}
</style>
</head>

<div id="overlay"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   Cuestionarios ORL — SNOT-22 · ACT · ACQ-5 · TAI
   Archivo único. Los datos se guardan sólo en el almacenamiento local
   (localStorage) de este iPad. Nada se envía a ningún servidor.
   ========================================================================= */

const KEY_P='orl_pacientes_v2', KEY_V='orl_visitas_v2', KEY_OLD='orl_cuestionarios_v1', SET_KEY='orl_cuestionarios_ajustes_v1';

/* ---------------------------- Cuestionarios ---------------------------- */
const SNOT_ITEMS = [
  'Necesidad de sonarse la nariz','Estornudos','Secreción nasal continua','Tos',
  'Sensación de moco que cae por la parte posterior de la garganta','Secreción nasal espesa',
  'Sensación de oído taponado','Mareo','Dolor de oído','Dolor/presión facial',
  'Dificultad para quedarse dormido','Se despierta durante la noche','Dormir mal por la noche',
  'Se despierta cansado','Fatiga o cansancio','Disminución en el rendimiento/productividad',
  'Disminución en la concentración','Frustrado/inquieto/irritable','Triste','Avergonzado',
  'Alteraciones del gusto/olfato','Congestión/obstrucción nasal'
];
const SNOT_OPTS = [
  {t:'Ningún problema',v:0},{t:'Problema muy leve',v:1},{t:'Problema leve',v:2},
  {t:'Problema moderado',v:3},{t:'Problema grave/severo',v:4},{t:'El problema ha llegado al máximo de su gravedad',v:5}
];
/* Dominios del SNOT-22 (DeConde et al., IFAR 2014). Números = orden de ítems de este formulario en español.
   «Secreción nasal espesa» (6) pertenece a dos dominios. Para modificar un dominio, edite su lista de ítems. */
const DOMAINS = [
  {k:'rin', n:'Rinológico',               items:[1,2,3,6,21,22]},
  {k:'ext', n:'Extranasal rinológico',    items:[4,5,6]},
  {k:'of',  n:'Oído / facial',            items:[7,8,9,10]},
  {k:'sue', n:'Sueño',                    items:[11,12,13,14,15]},
  {k:'psi', n:'Psicológico / emocional',  items:[16,17,18,19,20]}
];

const QD = {
  snot:{
    key:'snot', short:'SNOT-22', title:'Síntomas de nariz y senos paranasales (SNOT-22)',
    intro:'A continuación verá una lista de síntomas y de consecuencias sociales y emocionales relacionadas con su problema nasal. Califique cada uno según su gravedad y frecuencia <b>durante las últimas dos semanas</b>. No hay respuestas correctas o incorrectas.',
    prompt:'Durante las últimas 2 semanas, ¿qué tanto problema le ha causado…?', showNum:true,
    items: SNOT_ITEMS.map(q=>({q, opts:SNOT_OPTS}))
  },
  act:{
    key:'act', short:'ACT', title:'Prueba de Control del Asma (ACT)',
    intro:'Estas 5 preguntas nos ayudan a saber qué tan controlada está su asma. Piense en <b>las últimas 4 semanas</b>.',
    prompt:'', showNum:false,
    items:[
      {q:'En las últimas 4 semanas, ¿cuánto tiempo le ha impedido su asma hacer todo lo que quería en el trabajo, la escuela o la casa?',

const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum = a=>a.reduce((s,v)=>s+(+v||0),0);
const full = a=>Array.isArray(a)&&a.length>0&&a.every(v=>v!==null&&v!==undefined);
const pad = n=>String(n).padStart(2,'0');
function fmtD(iso){ const d=new Date(iso); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; }
function fmtDs(iso){ const d=new Date(iso); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${String(d.getFullYear()).slice(2)}`; }
function fmtT(iso){ const d=new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtDT(iso){ return fmtD(iso)+' '+fmtT(iso); }
function sameDay(a,b){ return new Date(a).toDateString()===new Date(b).toDateString(); }
function norm(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
function normId(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/^0+/,''); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function signed(n,dec=0){ const v=dec?n.toFixed(dec):String(n); return n>0?'+'+v:v; }
function maskMrn(m){ const p=parseMrn(m); if(!p) return m?'•••'+String(m).slice(-3):''; return `N-${'•'.repeat(Math.max(0,p.num.length-3))}${p.num.slice(-3)}/${p.year}`; }
function lastVisitT(p){ const vs=visitsOf(p.id); return vs.length?vs[vs.length-1].createdAt:''; }
/* Búsqueda parcial: número de expediente (≥3 dígitos, año opcional) o nombre (cada palabra escrita debe ser el inicio de una palabra del nombre). */
function searchMrn(n,y){
  const q=String(n||'').replace(/^0+/,''); if(q.length<3) return [];
  return PTS.filter(p=>{ const m=parseMrn(p.mrn); if(!m) return false; return m.num.replace(/^0+/,'').includes(q) && (!y || y.length<4 || m.year===y); })
            .sort((a,b)=>lastVisitT(b).localeCompare(lastVisitT(a)));
}
function searchName(s){
  const qt=norm(s).split(' ').filter(Boolean); if(!qt.some(t=>t.length>=3)) return [];
  return PTS.filter(p=>{ const pt=norm(p.name).split(' '); return qt.every(t=>pt.some(w=>w.startsWith(t))); })
            .sort((a,b)=>lastVisitT(b).localeCompare(lastVisitT(a)));
}

async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){
    const ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.top='0'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,t.length);

  }
}

/* Expediente: formato N-209089/2019 (número de 1–7 dígitos / año de apertura) */
function parseMrn(s){
  const m=String(s||'').trim().match(/^N?\s*-?\s*(\d{1,7})\s*\/\s*(\d{4})$/i); if(!m) return null;
  const y=+m[2]; if(y<1950||y>new Date().getFullYear()) return null;
  return {num:m[1], year:m[2], canon:`N-${m[1]}/${m[2]}`, key:`${m[1].replace(/^0+/,'')||'0'}/${m[2]}`};
}
const mrnKey = s=>{ const p=parseMrn(s); return p?p.key:normId(s); };
function mrnInput(pre, n, y, small){
  return `<div class="mrn ${small?'sm':''}"><span>N-</span><input id="${pre}Num" class="num" data-mrn="num" inputmode="numeric" pattern="[0-9]*" maxlength="7" placeholder="_______" autocomplete="off" value="${esc(n||'')}"><span>/</span><input id="${pre}Year" class="yr" data-mrn="yr" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="____" autocomplete="off" value="${esc(y||'')}"></div>`;
}
function readMrn(pre){
  const n=$('#'+pre+'Num').value.trim(), y=$('#'+pre+'Year').value.trim();
  if(!n && !y) return {empty:true, n, y};
  const p=parseMrn(`N-${n}/${y}`); return p?Object.assign({ok:true,n,y},p):{bad:true,n,y};
}

const eventsOf = p=>(p.events||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));

/* --------------------------- Puntuación e interpretación ---------------- */
const snotScore = v=>full(v.snot)?sum(v.snot):null;
const actScore  = v=>full(v.act)?sum(v.act):null;
const acqScore  = v=>full(v.acq5)?Math.round(sum(v.acq5)/v.acq5.length*100)/100:null;
const taiScore  = v=>full(v.tai)?sum(v.tai):null;
function domScore(v,d){ return full(v.snot)?sum(d.items.map(i=>v.snot[i-1])):null; }
function snotInterp(t){ if(t<20) return {lvl:'ok',txt:'Normal'}; if(t<=40) return {lvl:'warn',txt:'Sintomático'}; return {lvl:'bad',txt:'Afectación significativa de la calidad de vida'}; }
function actInterp(t){ if(t===25) return {lvl:'ok',txt:'Asma con control total'}; if(t>=20) return {lvl:'ok',txt:'Asma bien controlada'}; if(t>=16) return {lvl:'warn',txt:'Asma no bien controlada'}; return {lvl:'bad',txt:'Asma muy mal controlada'}; }
function acqInterp(m){ if(m<=0.75) return {lvl:'ok',txt:'Asma bien controlada'}; if(m<1.5) return {lvl:'warn',txt:'Control parcial / zona gris'}; return {lvl:'bad',txt:'Asma no controlada'}; }
function taiInterp(t){ if(t===50) return {lvl:'ok',txt:'Adhesión buena'}; if(t>=46) return {lvl:'warn',txt:'Adhesión intermedia'}; return {lvl:'bad',txt:'Adhesión mala'}; }
function taiPatterns(v){
  if(!full(v.tai)) return {list:[],pending:true};
  const list=[];
  if(sum(v.tai.slice(0,5))<25) list.push('errático');
  if(sum(v.tai.slice(5,10))<25) list.push('deliberado');
  const pending = v.tai11==null || v.tai12==null;
  if(!pending && (v.tai11+v.tai12)<4) list.push('inconsciente');
  return {list,pending};
}
function history(v,fn){ return visitsOf(v.patientId).filter(x=>x.createdAt<=v.createdAt && fn(x)!=null).map(x=>({val:fn(x),date:x.createdAt,id:x.id})); }

/* ---------------------------- Nota para el expediente ------------------- */
function trendTxt(h,dec){ return h.slice(-5).map(x=>`${dec?x.val.toFixed(dec):x.val} (${fmtDs(x.date)})`).join(' → '); }
function emrNote(v){
  const L=[`Cuestionarios en sala de espera (${fmtDT(v.createdAt)}):`];
  const pv=visitsOf(v.patientId), idx=pv.findIndex(x=>x.id===v.id), prevT=idx>0?new Date(pv[idx-1].createdAt).getTime():-Infinity, curT=new Date(v.createdAt).getTime();
  const evs=eventsOf(patient(v.patientId)||{}).filter(e=>evTime(e)>prevT && evTime(e)<=curT+12*36e5);
  if(evs.length) L.push(`- Eventos ${idx>0?'desde la visita previa':'registrados'}: `+evs.map(e=>`${EV_TYPES[e.type].n.toLowerCase()} ${fmtDs(e.date+'T12:00:00')}${e.note?` (${e.note})`:''}`).join('; ')+'.');
  const s=snotScore(v);
  if(s!=null){
    L.push(`- SNOT-22: ${s}/110 (${snotInterp(s).txt.toLowerCase()}). Dominios: `+DOMAINS.map(d=>`${d.n.toLowerCase()} ${domScore(v,d)}/${d.items.length*5}`).join(', ')+`. Obstrucción nasal ${v.snot[21]}/5; gusto/olfato ${v.snot[20]}/5.`);
    const h=history(v,snotScore);
    if(h.length>1){ const d=s-h[h.length-2].val; L.push(`  Evolución SNOT-22: ${trendTxt(h)}; cambio vs. previo ${signed(d)} ${Math.abs(d)>=9?'(≥ DMCI 9)':'(< DMCI 9)'}.`); }
  }
  const a=actScore(v);
  if(a!=null){
    let l=`- ACT: ${a}/25 (${actInterp(a).txt.toLowerCase()}).`;
    const h=history(v,actScore); if(h.length>1) l+=` Evolución: ${trendTxt(h)}.`;
    L.push(l);
  }
  const q=acqScore(v);
  if(q!=null){
    let l=`- ACQ-5: ${q.toFixed(2)} (${acqInterp(q).txt.toLowerCase()}).`;
    const h=history(v,acqScore); if(h.length>1) l+=` Evolución: ${trendTxt(h,2)}.`;
    L.push(l);
  }
  const t=taiScore(v);
  if(t!=null){
    const pt=taiPatterns(v);
    let l=`- TAI-10: ${t}/50 (${taiInterp(t).txt.toLowerCase()}).`;
    if(pt.list.length) l+=` Patrón: ${pt.list.join(', ')}.`;
    l+= pt.pending ? ' Ítems 11–12 pendientes.' : ` Conoce pauta: ${v.tai11===2?'sí':'no'}; técnica: ${v.tai12===2?'sin errores críticos':'con errores críticos'}.`;
    L.push(l);
  }
  return L.join('\n');
}

function scoreChips(v){
  const o=[];
  const s=snotScore(v); if(s!=null) o.push(`<span class="chip ${snotInterp(s).lvl}">SNOT-22 ${s}</span>`);
  const a=actScore(v); if(a!=null) o.push(`<span class="chip ${actInterp(a).lvl}">ACT ${a}</span>`);
  const q=acqScore(v); if(q!=null) o.push(`<span class="chip ${acqInterp(q).lvl}">ACQ-5 ${q.toFixed(2)}</span>`);
  const t=taiScore(v); if(t!=null) o.push(`<span class="chip ${taiInterp(t).lvl}">TAI ${t}</span>`);
  return o.join(' ');
}

/* ------------------------------ Gráficas -------------------------------- */
const BANDS = {
  snot:{min:0,max:110,ticks:[0,20,40,60,80,110],bands:[[0,19.5,'ok'],[19.5,40.5,'warn'],[40.5,110,'bad']]},
  act: {min:5,max:25,ticks:[5,10,15,20,25],bands:[[5,15.5,'bad'],[15.5,19.5,'warn'],[19.5,25,'ok']]},
  acq5:{min:0,max:6,ticks:[0,0.75,1.5,3,4.5,6],bands:[[0,0.75,'ok'],[0.75,1.5,'warn'],[1.5,6,'bad']]},
  tai: {min:10,max:50,ticks:[10,20,30,40,45,50],bands:[[10,45.5,'bad'],[45.5,49.5,'warn'],[49.5,50,'ok']]}
};
const BAND_FILL={ok:'#e4f4ea',warn:'#fdf1db',bad:'#fbe5e3'};
const DOM_COLORS=['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4'];
/* Gráfica con eje temporal real. series: [{color, pts:[{t,val,id,date}]}]; events: [{t,type}] */
function tsChart({key, min, max, ticks, tickFmt, bands, series, selId, dec, events, dom, labels, H, W}){
  W=W||520; H=H||220; const m={l:42,r:16,t:30,b:30};
  const iw=W-m.l-m.r, ih=H-m.t-m.b;
  const y=v=>m.t+ih-(v-min)/(max-min)*ih;
  const [t0,t1]=dom, x=t=> t1===t0 ? m.l+iw/2 : m.l+14+(t-t0)/(t1-t0)*(iw-28);
  const fv=v=>dec?v.toFixed(dec):v;
  let g='';
  if(bands) bands.forEach(([a,b,l])=>{ g+=`<rect x="${m.l}" y="${y(b)}" width="${iw}" height="${y(a)-y(b)}" fill="${BAND_FILL[l]}"/>`; });
  ticks.forEach(t=>{ g+=`<line x1="${m.l}" x2="${m.l+iw}" y1="${y(t)}" y2="${y(t)}" stroke="${bands?'#ffffff':'#e7ecf0'}" stroke-width="1"/><text x="${m.l-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="#5a6a7a">${tickFmt?tickFmt(t):t}</text>`; });
  /* eventos */
  let lastTag=-99, row=0;
  (events||[]).forEach(e=>{
    const ex=x(e.t); row = ex-lastTag<34 ? row+1 : 0; lastTag=ex;
    const a=EV_TYPES[e.type].a, w=a.length*7+10;
    g+=`<line x1="${ex}" x2="${ex}" y1="${m.t-6}" y2="${m.t+ih}" stroke="#3b4856" stroke-opacity=".55" stroke-width="1.5"/>
        <g transform="translate(${ex-w/2},${4+(row%2)*18})"><rect width="${w}" height="16" rx="4" fill="#3b4856" stroke="#fff" stroke-width="1.5"/><text x="${w/2}" y="12" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">${a}</text><title>${EV_TYPES[e.type].n} · ${fmtD(e.date+'T12:00:00')}${e.note?' · '+esc(e.note):''}</title></g>`;
  });
  /* series */
  series.forEach(se=>{
    if(se.pts.length>1) g+=`<polyline points="${se.pts.map(p=>`${x(p.t)},${y(p.val)}`).join(' ')}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  series.forEach(se=>{
    se.pts.forEach((p,i)=>{
      const sel=p.id===selId, last=i===se.pts.length-1;
      g+=`<g class="pt" data-a="pickVisit" data-id="${p.id}"><circle cx="${x(p.t)}" cy="${y(p.val)}" r="16" fill="transparent"/>
        <circle cx="${x(p.t)}" cy="${y(p.val)}" r="${sel?6:4.5}" fill="${se.color}" stroke="#fff" stroke-width="2"/>
        <title>${se.name?se.name+' · ':''}${fmtD(p.date)}: ${fv(p.val)}${se.suffix||''}</title></g>`;
      if(labels && (sel||last)){ const ty=y(p.val)-12<m.t+4?y(p.val)+20:y(p.val)-12;
        g+=`<text x="${x(p.t)}" y="${ty}" text-anchor="middle" font-size="13" font-weight="700" fill="#18232e" paint-order="stroke" stroke="#fff" stroke-width="3">${fv(p.val)}</text>`; }
    });
  });
  /* fechas de visita en el eje x (se omiten si se enciman) */
  const dates=[...new Map(series.flatMap(se=>se.pts).map(p=>[p.id,p])).values()].sort((a,b)=>a.t-b.t);
  let lx=-99; const keep=new Set();
  dates.forEach((p,i)=>{ const px=x(p.t); if(px-lx>=46 || p.id===selId){ if(p.id===selId && px-lx<46) keep.delete([...keep].pop()); keep.add(p.id); lx=px; } });
  dates.forEach(p=>{ if(!keep.has(p.id)) return; const sel=p.id===selId;
    g+=`<text x="${x(p.t)}" y="${H-10}" text-anchor="middle" font-size="11" fill="${sel?'#18232e':'#5a6a7a'}" font-weight="${sel?700:400}">${fmtDs(p.date)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución ${key}">${g}</svg>`;
}
function chartCard(key,title,cap,pts,ctx,dec,legend,extra){
  if(!pts.length) return '';
  const c=BANDS[key];
  return `<div class="chart" ${extra?'style="grid-column:1/-1"':''}><h4>${title}</h4><div class="cap">${cap}</div>
    ${tsChart({key, min:c.min, max:c.max, ticks:c.ticks, bands:c.bands, series:[{color:'#0f6e8c',pts}], selId:ctx.selId, dec, events:ctx.events, dom:ctx.dom, labels:true, H:extra?280:220, W:extra?900:520})}
    <div class="legend">${legend.map(([l,t])=>`<span><i style="background:${BAND_FILL[l]};border:1px solid var(--line)"></i>${t}</span>`).join('')}${ctx.events.length?'<span><i style="background:#3b4856"></i>Evento clínico</span>':''}</div>
    ${extra||''}</div>`;
}
function domainChart(win,ctx){
  const series=DOMAINS.map((d,i)=>({name:d.n, color:DOM_COLORS[i], suffix:'%', pts:win.filter(x=>full(x.snot)).map(x=>({t:new Date(x.createdAt).getTime(),val:Math.round(domScore(x,d)/(d.items.length*5)*100),date:x.createdAt,id:x.id}))}));
  return `<details class="sec" style="margin:10px 0 0;border-color:#edf1f4"><summary style="font-size:15px">Dominios del SNOT-22 en el tiempo <span class="muted" style="font-weight:400">(% del máximo de cada dominio)</span></summary><div class="body">
    ${tsChart({key:'dominios', min:0, max:100, ticks:[0,25,50,75,100], tickFmt:t=>t+'%', series, selId:ctx.selId, dec:0, events:ctx.events, dom:ctx.dom, labels:false, H:280, W:900})}
    <div class="legend" style="font-size:13px">${DOMAINS.map((d,i)=>`<span><span class="lkey" style="background:${DOM_COLORS[i]}"></span>${d.n} (máx. ${d.items.length*5})</span>`).join('')}</div>
    <div class="small muted" style="margin-top:6px">Se grafica como porcentaje porque cada dominio tiene un máximo distinto. Los valores exactos están en la tabla de abajo.</div>
  </div></details>`;
}

function vPatient(){
  const p=patient(S.pid); if(!p){ S.view='list'; return vList(); }
  const all=visitsOf(p.id); if(!all.length){ S.view='list'; return vList(); }
  let v=all.find(x=>x.id===S.vid)||all[all.length-1]; S.vid=v.id;
  const win = S.range==='5'?all.slice(-5):all;
  /* cards */
  const cards=[];
  const s=snotScore(v); if(s!=null) cards.push(scoreCard('SNOT-22',s,110,snotInterp(s),prevSub(v,snotScore,0,9)));
  const a=actScore(v); if(a!=null) cards.push(scoreCard('ACT',a,25,actInterp(a),prevSub(v,actScore,0,3)));
  const q=acqScore(v); if(q!=null) cards.push(scoreCard('ACQ-5 (media)',q.toFixed(2),'',acqInterp(q),prevSub(v,acqScore,2,0.5)));
  const t=taiScore(v); if(t!=null){ const pt=taiPatterns(v); cards.push(scoreCard('TAI-10',t,50,taiInterp(t),(pt.list.length?'Patrón: '+pt.list.join(', '):'Sin patrón de incumplimiento')+(pt.pending?' · ítems 11–12 pendientes':''))); }
  /* domains */
  const doms = s!=null ? `<div class="card" style="margin-bottom:14px"><h3>SNOT-22 por dominios</h3><div class="dom">${DOMAINS.map(d=>{const ds=domScore(v,d),mx=d.items.length*5;
      return `<div>${d.n}</div><div class="track"><i style="width:${ds/mx*100}%"></i></div><div class="v">${ds}/${mx}</div>`;}).join('')}</div></div>` : '';
  /* charts */
  const tOf=x=>new Date(x.createdAt).getTime();
  const evAll=eventsOf(p).map(e=>Object.assign({},e,{t:evTime(e)}));

  const ctx={selId:v.id, dom:[d0,d1], events:evAll.filter(e=>e.t>=d0-864e5 && e.t<=d1)};
  const mk=fn=>win.filter(x=>fn(x)!=null).map(x=>({val:fn(x),date:x.createdAt,id:x.id,t:tOf(x)}));
  const charts=[
    chartCard('snot','SNOT-22','0–110 · mayor = peor',mk(snotScore),ctx,0,[['ok','<20 normal'],['warn','20–40 sintomático'],['bad','>40 afectación']], all.some(x=>full(x.snot))?domainChart(win,ctx):''),
    chartCard('act','ACT','5–25 · mayor = mejor',mk(actScore),ctx,0,[['ok','≥20 controlada'],['warn','16–19 no bien'],['bad','≤15 muy mal']]),
    chartCard('acq5','ACQ-5','0–6 · mayor = peor',mk(acqScore),ctx,2,[['ok','≤0.75 controlada'],['warn','0.75–1.5 gris'],['bad','≥1.5 no controlada']]),
    chartCard('tai','TAI-10','10–50 · mayor = mejor',mk(taiScore),ctx,0,[['ok','50 buena'],['warn','46–49 intermedia'],['bad','≤45 mala']])
  ].join('');
  /* eventos clínicos */
  const today=new Date(); const iso=`${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
  const evCard=`<div class="card mini" style="margin-bottom:14px">

    ${evAll.length?[...evAll].reverse().map(e=>`<div class="ev"><span class="evtag">${EV_TYPES[e.type].a}</span><b style="min-width:92px">${fmtD(e.date+'T12:00:00')}</b><span>${EV_TYPES[e.type].n}</span><span class="muted" style="flex:1">${esc(e.note||'')}</span><button class="btn sm plain" data-a="delEv" data-id="${e.id}">Quitar</button></div>`).join(''):'<div class="muted small">Sin eventos registrados.</div>'}

      <input id="evNote" placeholder="Detalle (ej. CENS + septoplastía; dupilumab 300 mg c/2 sem)" style="flex:1;min-width:220px">

  /* history table */
  const hasAsthma = all.some(x=>x.act||x.acq5||x.tai);
  const histTable = `<div class="tablewrap"><table class="items"><tr><th>Fecha</th><th class="num">SNOT-22</th>${DOMAINS.map(d=>`<th class="num" title="${d.n}">${d.n.split(' ')[0].slice(0,5)}.</th>`).join('')}${hasAsthma?'<th class="num">ACT</th><th class="num">ACQ-5</th><th class="num">TAI</th>':''}</tr>
    ${[...win].reverse().map(x=>`<tr style="${x.id===v.id?'background:var(--brand-soft)':''}"><td><button class="link" style="font-size:15px;padding:0" data-a="pickVisit" data-id="${x.id}">${fmtD(x.createdAt)}</button></td>

      </div>
      <p class="small muted">Subtotales: ítems 1–5 (errático) = ${sum(v.tai.slice(0,5))}/25 · ítems 6–10 (deliberado) = ${sum(v.tai.slice(5,10))}/25 · ítems 11–12 (inconsciente) = ${v.tai11!=null&&v.tai12!=null?(v.tai11+v.tai12)+'/4':'pendiente'}</p>
      ${itemsTable(v,'tai')}</div></details>`);
  }
  const edit = S.editPt ? `<div class="card mini stack" style="margin-top:12px;background:#f7fafc">
      <div class="row"><label style="flex:2;min-width:220px">Nombre<br><input id="ePtName" value="${esc(p.name)}" style="width:100%"></label>
      <div style="flex:1;min-width:240px">Expediente<br>${(()=>{const q=parseMrn(p.mrn)||{}; return mrnInput('e',q.num,q.year,true);})()}${p.mrn&&!parseMrn(p.mrn)?`<div class="small" style="color:var(--bad)">Formato anterior: ${esc(p.mrn)}</div>`:''}</div></div>
      <div class="row"><button class="btn sm" data-a="savePt">Guardar</button><button class="btn sm plain" data-a="editPt">Cancelar</button><div class="spacer"></div>
      <button class="btn sm danger" data-a="delPt">Eliminar paciente y todas sus visitas</button></div></div>` : '';
  return `<div class="screen clin">
    ${clinTop('Paciente',`<button class="btn sm plain" data-a="toList">← Lista</button>`)}
    <div class="card" style="margin-bottom:14px">
      <div class="row"><div style="flex:1;min-width:220px"><h2 style="margin:0">${esc(p.name)}</h2>
        <div class="muted">${p.mrn?`Expediente ${esc(p.mrn)} · `:'Sin expediente · '}${COND_LABEL[v.condition]} · ${all.length} visita${all.length>1?'s':''}</div></div>
        <button class="btn sm plain" data-a="editPt">Editar datos</button></div>
      ${edit}
      <div style="margin-top:12px" class="small muted">Visita mostrada:</div>
      <div class="visits" style="margin-top:6px">${[...all].reverse().map(x=>`<button class="${x.id===v.id?'on':''}" data-a="pickVisit" data-id="${x.id}">${fmtD(x.createdAt)}</button>`).join('')}</div>
    </div>
    <div class="scores">${cards.join('')}</div>
    <div class="card" style="margin-bottom:14px">
      <div class="row" style="margin-bottom:8px"><h3 style="margin:0">Nota para el expediente</h3><div class="spacer"></div>

        <button class="btn sm" data-a="copy">Copiar</button></div>

      <div class="small muted">Puede editar el texto antes de copiarlo.</div>
    </div>
    ${doms}
    ${evCard}
    ${all.length>1||evAll.length?`<div class="card" style="margin-bottom:14px">
      <div class="row" style="margin-bottom:10px"><h3 style="margin:0">Evolución</h3><div class="spacer"></div>
        <div class="seg"><button class="${S.range==='5'?'on':''}" data-a="range" data-v="5">Últimas 5</button><button class="${S.range==='all'?'on':''}" data-a="range" data-v="all">Todas (${all.length})</button></div></div>
      <div class="charts">${charts}</div>
      <div class="small muted" style="margin-bottom:8px">Toque un punto o una fecha para ver esa visita.</div>
      ${histTable}</div>`:''}
    ${secs.join('')}
    <div class="row" style="margin:18px 0"><button class="btn sm ghost" data-a="moveVisit">Mover esta visita a otro paciente…</button><div class="spacer"></div><button class="btn sm danger" data-a="delVisit">Eliminar esta visita</button></div>

function guideHTML(){
  return `<details class="sec guide"><summary>Guía de interpretación (para residentes)</summary><div class="body">
  <h3>SNOT-22 (Sino-Nasal Outcome Test)</h3>
  <p>22 ítems de 0 a 5; total <b>0–110</b>. Periodo: últimas 2 semanas. Mayor puntuación = más síntomas y peor calidad de vida.</p>
  <table><tr><th>Puntuación</th><th>Interpretación</th></tr>
    <tr><td>0–19</td><td class="ok">Normal</td></tr><tr><td>20–40</td><td class="warn">Sintomático</td></tr>
    <tr><td>&gt; 40</td><td class="bad">Afectación significativa de la calidad de vida</td></tr></table>
  <p>DMCI: <b>≈ 9 puntos</b> (8.9; Hopkins 2009).</p>
  <table><tr><th>Dominio (DeConde 2014)</th><th>Ítems de este formulario</th><th>Máx.</th></tr>
    ${DOMAINS.map(d=>`<tr><td>${d.n}</td><td>${d.items.map(i=>`${i}. ${SNOT_ITEMS[i-1]}`).join('; ')}</td><td>${d.items.length*5}</td></tr>`).join('')}</table>
  <p class="small muted">«Secreción nasal espesa» cuenta en dos dominios, por eso la suma de dominios no es igual al total.</p>
  <h3>ACT (Asthma Control Test)</h3>
  <p>5 ítems de 1 a 5; total <b>5–25</b>. Periodo: últimas 4 semanas. Mayor = mejor control.</p>
  <table><tr><th>Puntuación</th><th>Interpretación</th></tr>
    <tr><td>25</td><td class="ok">Control total</td></tr><tr><td>20–24</td><td class="ok">Bien controlada</td></tr>
    <tr><td>16–19</td><td class="warn">No bien controlada</td></tr><tr><td>5–15</td><td class="bad">Muy mal controlada</td></tr></table>
  <p>DMCI: <b>3 puntos</b>.</p>
  <h3>ACQ-5 (Asthma Control Questionnaire)</h3>
  <p>5 ítems de 0 a 6; se reporta la <b>media</b> (0–6). Periodo: última semana. Mayor = peor control.</p>
  <table><tr><th>Media</th><th>Interpretación</th></tr>
    <tr><td>≤ 0.75</td><td class="ok">Bien controlada</td></tr><tr><td>0.76–1.49</td><td class="warn">Zona gris / control parcial</td></tr><tr><td>≥ 1.5</td><td class="bad">No controlada</td></tr></table>
  <p>DMCI: <b>0.5</b>. ACT y ACQ-5 miden control con ventanas distintas (4 semanas vs. 1 semana); si discrepan, considere eventos recientes.</p>
  <h3>TAI (Test de Adhesión a los Inhaladores)</h3>
  <p>Ítems 1–10 los contesta el paciente (1–5; total <b>10–50</b>). Ítems 11–12 los completa el profesional (1–2): conocimiento de la pauta y técnica inhalatoria.</p>
  <table><tr><th>TAI-10</th><th>Adhesión</th></tr><tr><td>50</td><td class="ok">Buena</td></tr><tr><td>46–49</td><td class="warn">Intermedia</td></tr><tr><td>≤ 45</td><td class="bad">Mala</td></tr></table>
  <table><tr><th>Patrón de incumplimiento</th><th>Ítems</th><th>Criterio</th><th>Abordaje sugerido</th></tr>
    <tr><td>Errático (olvido)</td><td>1–5</td><td>suma &lt; 25</td><td>Recordatorios, simplificar esquema</td></tr>
    <tr><td>Deliberado (decisión)</td><td>6–10</td><td>suma &lt; 25</td><td>Explorar creencias, miedos, costo</td></tr>
    <tr><td>Inconsciente (desconocimiento)</td><td>11–12</td><td>suma &lt; 4</td><td>Educación sobre la pauta y técnica</td></tr></table>
  <p class="small muted">Referencias: Hopkins C et al. Clin Otolaryngol 2009; DeConde AS et al. Int Forum Allergy Rhinol 2014; Nathan RA et al. JACI 2004; Schatz M et al. JACI 2009; Juniper EF et al. Respir Med 2006; Plaza V et al. J Aerosol Med Pulm Drug Deliv 2016. Herramienta de apoyo: no sustituye el juicio clínico.</p>
  </div></details>`;
}

/* --------------------------------- Acciones ------------------------------ */
const A = {
  start(){ S.draft=newDraft(); S.msg=''; go('id'); },
  home,
  toId(){ S.draft.patientId=null; go('id'); },
  toName(){ S.msg=''; go('name'); },
  idNext(){
    const r=readMrn('f'); S.draft.mrnN=r.n; S.draft.mrnY=r.y;
    if(r.empty){ toast('Escriba su número de expediente o toque «No tengo…»'); return; }
    if(r.ok){
      S.draft.mrn=r.canon;
      const f=findByMrn(r.canon);
      if(f.length===1){ selectPatient(f[0]); return; }
    }
    const c=searchMrn(r.n, r.y);
    if(c.length) return showCands(c,'id');
    if(r.bad){ toast(r.n.replace(/^0+/,'').length<3?'Escriba al menos 3 dígitos de su número de expediente':MRN_ERR); return; }
    S.draft.patientId=null; S.msg='No encontramos ese número. Si es la primera vez que contesta estos cuestionarios, complete sus datos. Si cree que es un error, regrese y revise el número.'; go('register');
  },
  nameNext(){
    const n=$('#fName').value.trim(); S.draft.name=n;
    if(!norm(n).split(' ').some(t=>t.length>=3)){ toast('Escriba al menos su nombre o un apellido'); return; }
    const c=searchName(n);
    if(c.length) return showCands(c,'name');
    if(n.split(/\s+/).length<2){ S.msg='No encontramos registros con ese nombre. Si es su primera vez, complete sus datos.'; go('register'); return; }
    S.msg=''; go('register');
  },
  pick(ds){ const p=patient(ds.id); S.draft.patientId=p.id; S.draft.name=p.name; S.draft.mrn=p.mrn||S.draft.mrn; S.draft.condition=p.condition||null; S.msg=''; go('cond'); },
  noneMine(){ S.draft.patientId=null; S.msg='Complete sus datos para registrarse.'; go('register'); },
  isMe(){ S.msg=''; go('cond'); },
  notMe(){ S.draft=newDraft(); S.msg='Revise su número de expediente o regístrese con su nombre.'; go('id'); },
  regNext(){
    const n=$('#fName').value.trim(), r=readMrn('f');
    S.draft.name=n; S.draft.mrnN=r.n; S.draft.mrnY=r.y;
    if(n.split(/\s+/).length<2){ toast('Escriba su nombre y al menos un apellido'); return; }
    if(r.bad){ toast(MRN_ERR); return; }
    const m=r.ok?r.canon:''; S.draft.mrn=m;
    const f=m?findByMrn(m):findByName(n);
    if(f.length===1){ selectPatient(f[0]); return; }
    S.draft.patientId=null; S.draft.condition=null; S.msg=''; go('cond');
  },
  cond(ds){
    const d=S.draft;
    if(d.condition!==ds.k || !S.steps.length){ d.condition=ds.k; d.snot=d.act=d.acq5=d.tai=null; S.steps=buildSteps(d); }
    S.step=0; render(); setTimeout(()=>{ if(S.view==='cond') go('quiz'); },180);
  },
  ans(ds){
    if(S.lock) return;
    const st=S.steps[S.step]; S.draft[st.s][st.i]=+ds.v; render();
    S.lock=true; setTimeout(()=>{ S.lock=false; if(S.view==='quiz') A.next(); },260);
  },
  next(){
    const st=S.steps[S.step];
    if(st.t==='q' && S.draft[st.s][st.i]==null) return;
    if(S.step<S.steps.length-1){ S.step++; render(); } else finish();
  },
  back(){ if(S.step>0){ S.step--; render(); } else go('cond'); },
  staff(){ S.pin=''; S.pinErr=false; go('pin'); },
  pinKey(ds){
    if(ds.k==='⌫'){ S.pin=S.pin.slice(0,-1); S.pinErr=false; render(); return; }
    if(S.pin.length>=6) return;
    S.pin+=ds.k; S.pinErr=false;
    if(S.pin===SET.pin){ S.pin=''; S.tab=null; go('list'); return; }
    if(S.pin.length>=Math.max(4,SET.pin.length)){ S.pinErr=true; S.pin=''; }
    render();
  },
  lock(){ home(); },
  settings(){ go('settings'); },
  toList(){ S.editPt=false; go('list'); },
  tab(ds){ S.tab=ds.k; render(); },
  clearF(){ S.search=''; render(); },
  openVisit(ds){ const v=VIS.find(x=>x.id===ds.id); S.pid=v.patientId; S.vid=v.id; S.editPt=false; go('patient'); },
  openPt(ds){ S.pid=ds.id; S.vid=null; S.editPt=false; go('patient'); },
  pickVisit(ds){ S.vid=ds.id; render(true); },
  range(ds){ S.range=ds.v; render(true); },
  reviewed(){ const v=VIS.find(x=>x.id===S.vid); v.reviewed=!v.reviewed; saveAll(); render(true); },
  tai(ds){ const v=VIS.find(x=>x.id===S.vid); v[ds.f]=+ds.v; saveAll(); render(true); },
  async copy(){ const ok=await copyText($('#note').value); toast(ok?'Nota copiada al portapapeles':'No se pudo copiar; seleccione el texto manualmente'); },
  editPt(){ S.editPt=!S.editPt; render(true); },
  addEv(){
    const p=patient(S.pid), d=$('#evDate').value, t=$('#evType').value, n=$('#evNote').value.trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){ toast('Seleccione la fecha del evento'); return; }
    (p.events=p.events||[]).push({id:uid(), date:d, type:t, note:n}); saveAll(); render(true); toast('Evento agregado');
  },
  delEv(ds){
    const p=patient(S.pid); if(!confirm('¿Quitar este evento?')) return;
    p.events=(p.events||[]).filter(e=>e.id!==ds.id); saveAll(); render(true);
  },
  savePt(){
    const p=patient(S.pid), n=$('#ePtName').value.trim(), r=readMrn('e');
    if(!n){ toast('El nombre no puede quedar vacío'); return; }
    if(r.bad){ toast(MRN_ERR); return; }
    const m=r.ok?r.canon:'';
    const clash=m?findByMrn(m).filter(x=>x.id!==p.id):[];
    if(clash.length){ toast(`Ese expediente ya pertenece a ${clash[0].name}. Use «Mover esta visita» para unir registros.`); return; }
    p.name=n; p.mrn=m; saveAll(); S.editPt=false; render(true); toast('Datos actualizados');
  },
  delPt(){
    const p=patient(S.pid);
    if(!confirm(`¿Eliminar a ${p.name} y sus ${visitsOf(p.id).length} visitas? No se puede deshacer.`)) return;
    VIS=VIS.filter(v=>v.patientId!==p.id); PTS=PTS.filter(x=>x.id!==p.id); saveAll(); S.editPt=false; go('list');
  },
  delVisit(){
    if(!confirm('¿Eliminar esta visita? No se puede deshacer.')) return;
    VIS=VIS.filter(x=>x.id!==S.vid);
    if(!visitsOf(S.pid).length){ PTS=PTS.filter(x=>x.id!==S.pid); saveAll(); go('list'); return; }
    S.vid=null; saveAll(); render();
  },
  moveVisit(){
    const m=prompt('Expediente del paciente al que pertenece esta visita (formato N-209089/2019):'); if(!m) return;
    if(!parseMrn(m)){ toast(MRN_ERR); return; }
    const f=findByMrn(m).filter(x=>x.id!==S.pid);
    if(!f.length){ toast('No hay otro paciente con ese expediente'); return; }
    if(!confirm(`¿Mover esta visita a ${f[0].name} (Exp. ${f[0].mrn})?`)) return;
    const v=VIS.find(x=>x.id===S.vid), from=S.pid; v.patientId=f[0].id;
    if(!visitsOf(from).length) PTS=PTS.filter(x=>x.id!==from);
    saveAll(); S.pid=f[0].id; render(); toast('Visita movida');
  },
  saveSet(){
    const c=$('#sClinic').value.trim(), i=parseInt($('#sIdle').value,10), p=$('#sPin').value.trim();
    if(p && !/^\d{4,6}$/.test(p)){ toast('El PIN debe tener de 4 a 6 dígitos'); return; }
    if(c) SET.clinicName=c; if(i>=1&&i<=30) SET.idleMin=i; if(p) SET.pin=p;
    saveSet(); toast('Ajustes guardados'); render();
  },
  exportCsv(){ download(`cuestionarios_${stamp()}.csv`, '﻿'+toCSV(), 'text/csv;charset=utf-8'); },
  exportJson(){ download(`respaldo_cuestionarios_${stamp()}.json`, JSON.stringify({version:2, exported:new Date().toISOString(), patients:PTS, visits:VIS},null,1), 'application/json'); },
  purgeAll(){
    const t=prompt('Para borrar TODOS los pacientes y visitas escriba BORRAR');
    if(t!=='BORRAR') return; PTS=[]; VIS=[]; saveAll(); render(); toast('Registros borrados');
  }
};

function finish(){
  const d=S.draft;
  let p=d.patientId?patient(d.patientId):null;
  if(!p){ p={id:uid(), name:d.name, mrn:d.mrn, condition:d.condition, createdAt:new Date().toISOString()}; PTS.push(p); }
  else if(!p.mrn && d.mrn){ p.mrn=d.mrn; }
  p.condition=d.condition;
  const asth=d.condition==='ambos';
  VIS.push({id:uid(), patientId:p.id, createdAt:new Date().toISOString(), condition:d.condition,
    snot:d.snot, act:asth?d.act:null, acq5:asth?d.acq5:null, tai:asth?d.tai:null, tai11:null, tai12:null, reviewed:false});
  saveAll();
  S.draft=null; S.steps=[]; go('done');
  let n=15; clearInterval(S.doneTimer);
  S.doneTimer=setInterval(()=>{ n--; const el=$('#doneCount'); if(el) el.textContent=`Esta pantalla se reiniciará en ${n} segundos.`; if(n<=0||S.view!=='done'){ clearInterval(S.doneTimer); if(S.view==='done') home(); } },1000);
}

/* ------------------------------ Exportación ------------------------------ */
function stamp(){ const d=new Date(); return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`; }
function toCSV(){
  const head=['paciente_id','nombre','expediente','visita_n','fecha','hora','padecimiento','snot22_total','snot22_interpretacion',...DOMAINS.map(d=>'dom_'+d.k),...SNOT_ITEMS.map((_,i)=>'snot_'+(i+1)),
    'act_total','act_interpretacion','act_1','act_2','act_3','act_4','act_5','acq5_media','acq5_interpretacion','acq_1','acq_2','acq_3','acq_4','acq_5',
    'tai10_total','tai_interpretacion',...Array.from({length:10},(_,i)=>'tai_'+(i+1)),'tai_11','tai_12','tai_patrones','revisado'];
  const q=v=>{ const s=String(v??''); return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const arr=(x,n)=>x?x:Array(n).fill('');
  const rows=[...VIS].sort((a,b)=>a.createdAt.localeCompare(b.createdAt)).map(v=>{
    const p=patient(v.patientId)||{}, s=snotScore(v), a=actScore(v), m=acqScore(v), t=taiScore(v);
    const n=visitsOf(v.patientId).findIndex(x=>x.id===v.id)+1;
    return [p.id,p.name,p.mrn,n,fmtD(v.createdAt),fmtT(v.createdAt),COND_LABEL[v.condition]||'',s??'',s!=null?snotInterp(s).txt:'',...DOMAINS.map(d=>domScore(v,d)??''),...arr(v.snot,22),
      a??'',a!=null?actInterp(a).txt:'',...arr(v.act,5),m??'',m!=null?acqInterp(m).txt:'',...arr(v.acq5,5),
      t??'',t!=null?taiInterp(t).txt:'',...arr(v.tai,10),v.tai11??'',v.tai12??'',t!=null?taiPatterns(v).list.join(' + '):'',v.reviewed?'sí':'no'].map(q).join(',');
  });
  return [head.join(','),...rows].join('\r\n');
}
async function download(name,text,type){
  const blob=new Blob([text],{type});
  try{ const file=new File([blob],name,{type}); if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); return; } }
  catch(e){ if(e && e.name==='AbortError') return; }
  const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
function importJson(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const data=JSON.parse(fr.result);
      if(!Array.isArray(data.patients)||!Array.isArray(data.visits)) throw new Error();
      const pid=new Set(PTS.map(p=>p.id)), vid=new Set(VIS.map(v=>v.id)); let np=0,nv=0;
      data.patients.forEach(p=>{ if(p&&p.id&&!pid.has(p.id)){ PTS.push(p); np++; } });
      data.visits.forEach(v=>{ if(v&&v.id&&v.patientId&&!vid.has(v.id)){ VIS.push(v); nv++; } });
      saveAll(); render(); toast(`${np} pacientes y ${nv} visitas restaurados`);
    }catch(e){ toast('Archivo de respaldo no válido'); }
  };
  fr.readAsText(file);
}

/* ------------------------------ Inactividad ------------------------------ */
const PATIENT_VIEWS=['pick','id','name','confirm','register','cond','quiz'], CLIN_VIEWS=['pin','list','patient','settings'];
function showIdle(){
  idleShown=true; idleCount=30; const o=$('#overlay'); o.classList.add('show');
  o.innerHTML=`<div class="card stack"><h2>¿Sigue ahí?</h2><p class="lead" id="idleTxt">El cuestionario se reiniciará en ${idleCount} segundos.</p><div><button class="btn big" data-a="idleStay">Sí, continuar</button></div></div>`;
}
function hideIdle(){ idleShown=false; const o=$('#overlay'); o.classList.remove('show'); o.innerHTML=''; }
setInterval(()=>{
  const idle=(Date.now()-lastAct)/1000;
  if(PATIENT_VIEWS.includes(S.view)){
    if(!idleShown && idle>SET.idleMin*60) showIdle();
    else if(idleShown){ idleCount--; const t=$('#idleTxt'); if(t) t.textContent=`El cuestionario se reiniciará en ${idleCount} segundos.`; if(idleCount<=0) home(); }
  } else if(CLIN_VIEWS.includes(S.view) && idle>300){ home(); }
},1000);

/* --------------------------------- Eventos ------------------------------- */
['pointerdown','keydown','scroll','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{ lastAct=Date.now(); },{passive:true}));
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b) return;
  if(b.dataset.a==='idleStay'){ hideIdle(); lastAct=Date.now(); return; }
  const f=A[b.dataset.a]; if(f) f(b.dataset,b);
});
document.addEventListener('input',e=>{
  if(e.target.dataset && e.target.dataset.mrn){
    const el=e.target, clean=el.value.replace(/\D/g,''); if(clean!==el.value) el.value=clean;
    if(el.dataset.mrn==='num' && clean.length>=7){ const y=document.getElementById(el.id.replace('Num','Year')); if(y) y.focus(); }
    return;
  }
  if(e.target.id==='fSearch'){ S.search=e.target.value; const pos=e.target.selectionStart; render(true); const f=$('#fSearch'); f.focus(); f.setSelectionRange(pos,pos); }
});
document.addEventListener('change',e=>{ if(e.target.id==='importFile' && e.target.files[0]) importJson(e.target.files[0]); });
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  const map={id:'idNext',name:'nameNext',register:'regNext'}; if(map[S.view]){ e.preventDefault(); A[map[S.view]](); }
});
render();
/* ---------------------- Modo sin conexión (service worker) ---------------------- */
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
async function offlineCheck(){
  const el=document.getElementById('offlineState'); if(!el) return;
  try{ const ok=!!(window.caches && await caches.match('index.html',{ignoreSearch:true}) || await caches.match('./')); el.textContent=ok?'listo ✓':'no disponible (abra la app una vez con internet)'; el.style.color=ok?'var(--ok)':'var(--bad)'; }
  catch(e){ el.textContent='no disponible'; }
}
new MutationObserver(()=>offlineCheck()).observe(document.getElementById('app'),{childList:true});
</script>
